- tubo:
  - entrada: |
      "Olá, mundo!"
  - comando: node fonte/analisador-léxico.js
    saída_esperada: |
      [
        {
          "texto": "Olá, mundo!"
        },
        {
          "fim": true
        }
      ]
  - comando: node fonte/analisador-sintático.js
    saída_esperada: |
      {
        "texto": "Olá, mundo!"
      }
  - comando: node fonte/analisador-semântico.js
    saída_esperada: |
      Olá, mundo!

- tubo:
  - entrada: |
      "Outro texto"
  - comando: node fonte/analisador-léxico.js
    saída_esperada: |
      [
        {
          "texto": "Outro texto"
        },
        {
          "fim": true
        }
      ]
  - comando: node fonte/analisador-sintático.js
    saída_esperada: |
      {
        "texto": "Outro texto"
      }
  - comando: node fonte/analisador-semântico.js
    saída_esperada: |
      Outro texto