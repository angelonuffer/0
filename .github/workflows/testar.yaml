name: Testar
on:
  workflow_dispatch:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main
jobs:
  testar:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.21.0
    - run: node testar.js
